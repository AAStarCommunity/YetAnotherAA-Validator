name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Job 1: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # `npm audit` exits 1 for BOTH "I found high-severity advisories" and "I could not reach the
      # registry", and those two need opposite responses. Twice today that ambiguity cost real time:
      # a local run against a mirror that does not implement the audit endpoint returned exit 1 on
      # BOTH master and the branch under test, which is indistinguishable from "neither is fixed"; and
      # this job went red twice on `npm error audit endpoint returned an error` (503), then a third
      # time by hanging until the job timed out — with `found 0 vulnerabilities` printed earlier in
      # the very same run.
      #
      # So: ask for JSON, decide from the DATA, and say which of the two things happened.
      #
      # ON AN INFRASTRUCTURE ERROR THIS PASSES, DELIBERATELY, AND LOUDLY. That is a fail-open, and it
      # is the right trade only because of what it is traded against: a red that means "npm is down"
      # blocks every merge in the repo while teaching everyone to read a red audit as noise — which is
      # exactly how a real advisory gets waved through. The other three checks in this job (Trivy,
      # CodeQL, Dependency Review) do not depend on that endpoint. A registry outage is never silent
      # here: it prints a ::warning:: naming itself.
      #
      # Advisory DATA is never fail-open: if the JSON parses, high+critical > 0 fails the step.
      - name: Run npm audit
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            # --ignore-scripts is not needed (nothing is installed here) but the timeout is: the
            # hang is what turned a 20-second step into a cancelled 10-minute job.
            out=$(timeout 120 npm audit --audit-level=high --json 2>/dev/null || true)
            if [ -n "$out" ] && printf '%s' "$out" | jq -e '.metadata.vulnerabilities' >/dev/null 2>&1; then
              break
            fi
            echo "npm audit attempt $attempt did not return advisory data; retrying in $((attempt * 15))s"
            out=""
            sleep $((attempt * 15))
          done

          if [ -z "$out" ]; then
            echo "::warning title=npm audit could not run::The registry did not return advisory data after 3 attempts. This step PASSED WITHOUT CHECKING npm advisories — it is not a statement that there are none. Trivy, CodeQL and Dependency Review still ran."
            exit 0
          fi

          printf '%s' "$out" | jq -r '
            .metadata.vulnerabilities as $v
            | "advisories: critical=\($v.critical) high=\($v.high) moderate=\($v.moderate) low=\($v.low)"'
          bad=$(printf '%s' "$out" | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical')
          if [ "$bad" -gt 0 ]; then
            printf '%s' "$out" | jq -r '.vulnerabilities | to_entries[] | "  \(.value.severity)\t\(.key)\t\(.value.range)"'
            echo "::error title=npm audit found high-severity advisories::$bad high or critical advisory/advisories. This IS advisory data, not an outage."
            exit 1
          fi
          echo "npm audit: no high or critical advisories."

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Job 2: Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      # CC-115 B3 / PR-D1: deploy scripts and runbooks must not instruct the removed SP 4.11
      # `setFraudProofVerifier` setter, and must keep the propose -> 4 days -> apply handoff intact.
      # Not compile-checkable (we never build against SP), so it is asserted statically.
      - name: Check fraud-proof verifier arming instructions
        run: npm run check:arming

      # The sentinel exemption decides whether an unsatisfiable requiredQuorum() pages or is shrugged
      # off. It has been wrong once (excluding beforeWindow paged CRITICAL at every epoch boundary on
      # a healthy stack), and the fix WIDENED a "do not alert" predicate -- the change most able to
      # swallow a real outage silently. Its safety conjunct (usablePrev) cannot be exercised against
      # a live chain: the decisive state needs archive data and cannot be provoked on demand. Six
      # synthetic cells, and a guard that both answers actually occur.
      - name: Check the sentinel benign-state classifier
        run: npm run check:classify

  # Job 3: Build project
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          CI: true

  # Job 4: Run tests
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true
          NODE_ENV: test

  # Job 5: Solidity contracts
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # PINNED, not `nightly`. `nightly` means the toolchain can move under a PR that changed
      # nothing, and the resulting failure looks like that PR's fault. That already cost this
      # ecosystem real time: foundry 1.8.x runs each top-level call inside a test as its own
      # transaction, so EIP-1153 transient storage is cleared BETWEEN top-level calls. That broke
      # airaccount-contract's suite, which passes algId from validateUserOp to execute() through a
      # content-keyed transient slot (AAStarAirAccountBase.sol `tstore`/`tload`) — the slot read
      # back as 0, surfacing as InsufficientTier(x, 0). It blocked CC-116 PR #208 until PR #209
      # pinned 1.7.1 there.
      #
      # THIS repo is not exposed to that mechanism: its suite is green on BOTH 1.7.1 and 1.8.1
      # (verified by pr-daemon on #247, same tree, binary swapped). The pin is preventive — it
      # stops a future toolchain bump from landing silently on an unrelated PR. 1.7.1 is the
      # version this repo's suite is developed against locally; CI ran `nightly` until this PR,
      # so 1.7.1 was never CI-verified here before it.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.7.1"

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -vvv

      - name: Check contract sizes
        run: forge build --sizes

      - name: Run coverage
        run: forge coverage

  # Job 6: Type checking
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run type-check

  # Job 7: CodeQL Analysis
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # Job 8: Summary job for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security, quality, build, test, contracts, typecheck, codeql]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.security.result }}" == "success" &&
                "${{ needs.quality.result }}" == "success" &&
                "${{ needs.build.result }}" == "success" &&
                "${{ needs.test.result }}" == "success" &&
                "${{ needs.contracts.result }}" == "success" &&
                "${{ needs.typecheck.result }}" == "success" &&
                "${{ needs.codeql.result }}" == "success" ]]; then
            echo "All CI checks passed!"
          else
            echo "Some CI checks failed"
            exit 1
          fi
