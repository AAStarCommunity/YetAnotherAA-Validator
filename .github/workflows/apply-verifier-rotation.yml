# CC-115 B3 — finalise the verifier rotation once its delay matures.
#
# The four-day wait is the security property (CC-48 MEDIUM-1): a public window in which anyone can
# see which verifier is about to become authoritative. Nothing here shortens it. What this removes is
# a different risk -- that the last step simply never happens because the person who knew about it
# was not around on the day.
#
# WHY IT IS SAFE TO RUN THIS UNATTENDED, stated rather than assumed:
#
#   * applyFraudProofVerifier() is PERMISSIONLESS and takes no arguments. It cannot choose a verifier;
#     it can only finalise the one the aggregator owner already proposed and that has already served
#     its full delay. There is no decision left to make, which is exactly why SP made it
#     permissionless -- keeping it owner-only would hand the owner a second, unbounded veto.
#   * The key in APPLY_KEEPER_KEY is a DEDICATED throwaway with no rights anywhere, funded with a
#     small amount purely to pay this gas. Losing it costs that gas and nothing else.
#   * deploy/apply-verifier-rotation.mjs refuses to act before readyAt, and checks that the pending
#     verifier is the one expected before broadcasting -- applying a rotation is not the moment to
#     discover a different contract was proposed.
#
# Idempotent by design: after it succeeds, every later run reports "already applied" and exits 0. It
# is NOT self-disabling, because a job that turns itself off cannot tell you it stopped.
#
# ############################################################################################
# THE SCHEDULE BELOW IS DAILY, AND DAILY SCHEDULES DO GET DELIVERED -- hours late.
#
# GitHub Actions `schedule` DOES fire here -- sparsely. An earlier version of this text said it never
# does, measured over 6h33m with 26 expected ticks and 0 runs. That window sat ENTIRELY INSIDE a
# registration delay: the workflow landed on master at 03:44Z and first fired at 11:10Z, 53 minutes
# AFTER the window closed. Corrected measurements, four repos, same org:
#
#   15-min cron, dvt                  3 scheduled runs TOTAL in 20.9h vs 84 slots = 3.6%; the first of
#                                   those came 7.4h after the workflow landed on master
#   15-min cron, airaccount-contract  fires, similarly sparse
#   daily cron, aastar-sdk            76 runs / 76 distinct days = 100% delivery; median 2.1h late
#                                   (p25 1.1, p75 2.9, max 11.7 -- a ~47x spread, not a fixed offset)
#   daily cron, SuperPaymaster        fires, 5-8h late
#
# So: DAILY schedules are delivered (hours late); SUB-HOURLY ones are mostly dropped; and a newly
# added workflow does not fire for several hours. None of the documented causes applied -- not
# archived or disabled, not a fork, file on the default branch, `gh workflow list` and the API both
# reporting state=active.
#
# The local heartbeat is still the right primary trigger, but for the corrected reason: 3.6% delivery
# cannot monitor a 12-minute outage, NOT that nothing ever runs.
#
# So this workflow was a genuine second path to the 2026-09-04 apply, not a decorative one.
#
# WHAT ACTUALLY HAPPENED (2026-09-04): NEITHER automation applied the rotation. Tx 0x9add3d63... at
# 05:37:12Z, 48 s after readyAt -- before this workflow's 06:41Z cron and before the local job's next
# tick. NOT an external party: the signer is this repo's own .env.sepolia deploy key, i.e. a MANUAL
# run of the same apply-verifier-rotation.mjs these jobs wrap. So the belt-and-braces was never
# exercised on the one day it existed for; both jobs merely observed the event. A green run of either
# proves the trigger fires, not that its broadcast path works -- that path is still untested.
# Do not credit a later green run with the apply, and do not expect this workflow to publish the
# readback: the already-applied branch broadcasts nothing and writes no artifact.
#
# The schedule is kept because the script's already-applied branch is a drift guard -- it fails
# loudly on a disarm, on a different active verifier, or on a later rotation proposing an address it
# is not pinned to. That is now this workflow's whole job. Repoint the expected verifier before any
# future rotation or it goes red on a correct chain state.
# ############################################################################################
name: Apply Verifier Rotation

on:
  schedule:
    # Daily, offset off the hour. The rotation this was written for (readyAt 2026-09-04T05:36:24Z)
    # was applied externally at 05:37:12Z, before this cron could run; runs from then on exit 0 as a
    # pinned-state check. The countdown branch below still matters for the NEXT rotation: waiting out
    # a delay is the DESIGNED state for four consecutive days, and painting those red would make a
    # real failure on the fifth indistinguishable from them. A pending proposal does NOT expire, so a
    # missed day costs nothing -- which is also why a constant concurrency group is right here.
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: apply-verifier-rotation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Needed for the readback step below. The apply itself was already automated twice over, but
      # the thing downstream actually waits on -- CC-115 records 6/7 reaching @repo:dsr so the B3
      # manifest can freeze -- was still a step someone had to remember on the day. Automating the
      # action while leaving the report-back manual is the same shape as a monitor whose trigger
      # never fires: the capability exists and the outcome still does not happen.
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Pinned exactly, same reasoning as the health check: this is a broadcasting path, and an
      # unpinned range means a bad patch turns into a failed governance step.
      - name: Install ethers
        run: npm install --no-save --no-audit --no-fund --ignore-scripts ethers@6.17.0

      - name: Apply the matured rotation
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
          KEEPER_PRIVATE_KEY: ${{ secrets.APPLY_KEEPER_KEY }}
        run: |
          if [ -z "$KEEPER_PRIVATE_KEY" ]; then
            echo "::error::APPLY_KEEPER_KEY is not set — this workflow cannot broadcast. Set the secret to a funded throwaway key (applyFraudProofVerifier is permissionless, so it needs no rights)." >&2
            exit 2
          fi
          node deploy/apply-verifier-rotation.mjs --broadcast

      # ALWAYS, not on success. The run that most needs an artifact is the one that failed AFTER the
      # transaction landed — a mismatch means the rotation happened onto a verifier nobody proposed,
      # and the old `success()` guard published nothing in exactly that case. A red job AND a
      # published artifact is the right combination. Later runs report "already applied" and write no
      # artifact, so this still does not reopen an issue every day. (Review B1 on PR #287.)
      - name: Publish the readback
        if: always() && hashFiles('rotation-readback.json') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const rb = JSON.parse(require('fs').readFileSync('rotation-readback.json', 'utf8'));
            const ok = rb.status === 'ok';
            const head = ok
              ? '**CC-115 B3 — records 6 and 7 are now available.**'
              : '🔴 **CC-115 B3 — the apply transaction LANDED but the run did not end clean (status: `'
                + rb.status + '`).** Read the table before acting; do not assume the rotation is good.';
            const body = [
              head,
              'Posted automatically by the run that applied the rotation, so the readback does not',
              'depend on anyone being present on the day — and it is posted whether or not the run',
              'succeeded, because a landed transaction with a bad outcome is the case most worth',
              'reporting.',
              '',
              '| field | value |',
              '| --- | --- |',
              '| status | `' + rb.status + '` |',
              '| chainId | `' + (rb.chainId ?? 'unread') + '` |',
              '| aggregator | `' + rb.aggregator + '` |',
              '| apply tx | `' + rb.applyTxHash + '` |',
              '| applied at block | `' + rb.appliedAtBlock + '` |',
              '| expected verifier | `' + rb.expectedVerifier + '` |',
              '| `fraudProofVerifier` | `' + (rb.fraudProofVerifier ?? 'unread') + '`' + (ok ? '' : ' ⚠️') + ' |',
              '| `pendingFraudProofVerifier` | `' + (rb.pendingFraudProofVerifier ?? 'unread') + '` |',
              '| `pendingFraudProofVerifierReadyAt` | `' + (rb.pendingFraudProofVerifierReadyAt ?? 'unread') + '` |',
              '| applied at (UTC) | `' + rb.appliedAtUtc + '` |',
              '',
              '',
              ok
                ? '**Next action:** paste the table into CC-115 for `@repo:dsr`, who is blocked on it to '
                  + 'freeze the B3 manifest; SP is separately waiting for a non-zero `fraudProofVerifier` '
                  + 'before running its 09-04 step.'
                : '**Next action:** do NOT report this as a clean arming. Investigate first — the '
                  + 'transaction is on chain either way, so the aggregator state above is what it is.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: ok
                ? 'CC-115 B3 readback — verifier rotation applied'
                : 'CC-115 B3 readback — rotation applied with status: ' + rb.status,
              body,
            });
