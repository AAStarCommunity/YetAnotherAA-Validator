# Scheduled committee liveness check.
#
# The tool this runs (deploy/committee-health.mjs, #250) was written because tier-2/3 went down for
# ten hours and nothing noticed. A checker nobody schedules would have changed exactly nothing about
# that outage, so this workflow is the half that makes it real.
#
# Deliberately runs HERE and not on the box that runs the keeper: the keeper's machine going away is
# one of the failure modes being watched for, and a watchdog sharing its fate is not a watchdog.
#
# HOW THIS ACTUALLY NOTIFIES -- a decision, not an assumption, and each layer of it was wrong once:
#
#   1. "a failing scheduled workflow notifies someone" is false on its own. GitHub mails a `schedule`
#      failure to ONE account -- whoever last edited the cron -- and only if they have Actions
#      notifications on.
#   2. So a failure opens a tracking issue. But an issue opened by github-actions[bot] with no
#      assignee notifies NOBODY: the default subscription is "Participating and @mentions", so only
#      watchers set to All Activity would ever see it. Visible is not notified.
#   3. Therefore the issue is ASSIGNED. Assignment always notifies, and the assignee is the sink --
#      change `vars.COMMITTEE_HEALTH_ASSIGNEE` to move it, do not remove it.
#
# ACCEPTED GAP, named so nobody mistakes it for covered. Two ways this stops running, both invisible
# from inside:
#
#   a. GitHub DISABLES scheduled workflows after 60 days of repository inactivity. A repo that watches
#      a deployed system can plausibly go quiet that long while the system keeps running.
#   b. GitHub delays and DROPS scheduled runs under load. This is not theoretical here: measured on
#      this repo, `*/15` produced zero runs across four expected ticks in 53 minutes while every other
#      trigger worked. The cron above uses offset minutes because of that, which improves the odds and
#      guarantees nothing.
#
# In both cases the silence is identical to "all healthy" -- nothing inside this repo can detect that
# its own scheduler stopped. Closing it needs an EXTERNAL heartbeat ("alert if no run appeared in 30
# minutes"), which does not exist yet and is NOT tracked anywhere else.
#
# This workflow covers "the check ran and failed", never "the check ran at all". That sentence is the
# whole of the coverage claim.
name: Committee Health

on:
  schedule:
    # Roughly every 15 minutes -- the sentinel appears about one epoch (~13 min at epochLength 64)
    # after the last successful pin, so that is the finest granularity that is not just noise.
    #
    # OFFSET MINUTES ON PURPOSE, not */15. Measured on this repo: with `*/15` (i.e. :00/:15/:30/:45,
    # the slots every other cron in the world also picks) NOT ONE scheduled run fired in 53 minutes
    # across four expected ticks, while push- and pull_request-triggered runs went through normally
    # the whole time. The configuration was correct -- cron on the default branch, workflow active,
    # public non-fork repo, manual dispatch green. GitHub simply delays and drops scheduled runs under
    # load, and the top-of-hour slots are where that load is.
    #
    # FOLLOW-UP MEASUREMENT (2026-08-31), which CONTRADICTS the reading that offsetting is a fix:
    # with the offset cron below, on the default branch, this workflow went 6h33m / 26 expected ticks
    # with ZERO scheduled runs. The `on:` block parses to a valid schedule, the API reports
    # state=active, the repo is neither archived nor disabled, pushes happened throughout, and
    # workflow_dispatch is green. airaccount-contract measured the same on its own offset cron.
    # So the offset is kept only because it costs nothing -- it is NOT what makes this work, and
    # NOTHING here has yet been observed to make it work. This monitor's capability is verified;
    # its trigger is not. Treat scheduled coverage as UNPROVEN and dispatch manually when it matters.
    #
    # So "every 15 minutes" is a REQUEST, never a guarantee. That is the second half of the ACCEPTED
    # GAP below: the scheduler can be switched off after 60 days, and even while on it can silently
    # skip. Both need the same external heartbeat to detect, and neither is visible from inside.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      validator:
        description: "Validator address to check (defaults to the COMMITTEE_VALIDATOR repo variable)"
        required: false

# A run in flight must not be cancelled by the next tick, or a slow RPC could silently skip checks.
concurrency:
  group: committee-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # Lets the alert job tell "the committee is unhealthy" apart from "the runner could not get far
      # enough to ask". All three are empty when the job was cancelled before the step resolved, which
      # the alert job treats as infrastructure -- never as a committee verdict.
      #
      # `outcome` alone is NOT enough: the script deliberately separates exit 1 ("the committee cannot
      # serve") from exit 2 ("could not determine"), and `outcome` flattens both to "failure". Branching
      # on it would tell an operator the committee is unhealthy when the truth is that nothing could be
      # read -- and the very next paragraph of that issue body explains the two codes, contradicting
      # itself. So the code itself is carried across.
      liveness: ${{ steps.liveness.outcome }}
      exit_code: ${{ steps.liveness.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # An empty validator is a HARD FAILURE, not a fallback. committee-health.mjs carries a hard-coded
      # default for local use; letting the schedule path reach it means that after the pending v0.32.0
      # -> v0.33.0 stack migration this workflow would keep reporting green about a contract nobody
      # uses. A green run against the wrong contract is worse than no run.
      # Name the STACK, not the validator. algId 0x01 on a stack's router is what decides which
      # validator that stack actually uses, so deriving from it means this can never watch a contract
      # nobody uses -- which is not hypothetical: it happened the day v0.33.0 shipped, while this
      # workflow was still pinned by a repository variable to the previous stack's validator.
      - name: Require a stack to watch
        env:
          COMMITTEE_ROUTER: ${{ vars.COMMITTEE_ROUTER }}
          COMMITTEE_VALIDATOR: ${{ inputs.validator }}
        run: |
          if [ -z "$COMMITTEE_VALIDATOR" ] && [ -z "$COMMITTEE_ROUTER" ]; then
            echo "::error::Set the COMMITTEE_ROUTER repository variable to the account stack's ValidatorRouter (Settings > Secrets and variables > Actions > Variables). Refusing to fall back to the address compiled into committee-health.mjs." >&2
            exit 2
          fi
          echo "watching ${COMMITTEE_VALIDATOR:-stack at router $COMMITTEE_ROUTER}"

      # Pinned exactly (not a range) and installed with --ignore-scripts. This runs on the alerting
      # path 96 times a day: a range means a bad patch or a registry blip exits non-zero, and without
      # the per-step outcome below the only downstream signal would be "Committee Health failed" --
      # indistinguishable from tier-2/3 actually being down. 6.17.0 is what package-lock.json already
      # resolves for the repo's ^6.17.0.
      - name: Install ethers
        run: npm install --no-save --no-audit --no-fund --ignore-scripts ethers@6.17.0

      - name: Check committee liveness
        id: liveness
        env:
          # Falls back to a public endpoint so this works without repo secrets. Set the secret to use a
          # dedicated provider; the script accepts SEPOLIA_RPC_URL / ETH_RPC_URL / RPC_URL.
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
          COMMITTEE_ROUTER: ${{ vars.COMMITTEE_ROUTER }}
          COMMITTEE_VALIDATOR: ${{ inputs.validator }}
          # The validator this workflow watches is mounted and armed, so epochLength == 0 is an
          # incident here, not a resting state. Without this the checker would report OK while every
          # account on that validator had tier-2/3 failing closed under the CC-116 account-side gate.
          # TRUE only when this is the scheduled watch of the repo's own validator. A
          # workflow_dispatch aimed at some other address -- an unmounted candidate, say -- must not be
          # judged against the expectation that it is armed. The previous version set this
          # unconditionally, which its own comment in committee-health.mjs denied.
          EXPECT_COMMITTEE_ACTIVE: ${{ inputs.validator && 'false' || 'true' }}
        run: |
          # Straight to stdout -- no capture, no pipe. Capturing into a variable buffered everything
          # until the script returned, so a hung script killed by the 5-minute timeout died BEFORE
          # printing and the whole stdout was lost from the run log, on precisely the path the alert
          # job exists for. The tee that replaced it wrote a file nobody read, and PIPESTATUS was only
          # needed because of the pipe. Under `set +e`, plain `$?` is the whole answer.
          set +e
          node deploy/committee-health.mjs --json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

  # A SEPARATE job on purpose. `if: failure()` inside `check` would not run when `check` is CANCELLED,
  # and `timeout-minutes: 5` cancels it -- so the most likely way for a monitor to go blind (a hung
  # RPC, a hung install) would have produced no alert at all. An in-job `|| cancelled()` does not fix
  # that either: the enclosing job's budget is already spent. This job has its own budget, needs no
  # checkout, and fires on every non-success result including cancelled and skipped.
  alert:
    needs: check
    # Never alert for an ad-hoc dispatch at another address. Its verdict is about a different
    # contract, but the issue it would open lands in the SAME dedup namespace -- an unmounted
    # candidate files `failing`, a typo'd address files `undetermined` -- and then suppresses the
    # real alert for that category. `inputs` is falsy on the schedule path, so the watch is unaffected.
    if: ${{ always() && needs.check.result != 'success' && !inputs.validator }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Raise a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # gh resolves the target repo from the checked-out git remote, and this job has no checkout
          # BY DESIGN. Without this, `gh issue create` fails outright -- an alert path that disappears
          # exactly when infrastructure is what broke.
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.check.result }}
          LIVENESS: ${{ needs.check.outputs.liveness }}
          EXIT_CODE: ${{ needs.check.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WATCHED: ${{ vars.COMMITTEE_ROUTER }}
          ASSIGNEE: ${{ vars.COMMITTEE_HEALTH_ASSIGNEE || 'jhfnetboy' }}
        run: |
          set -euo pipefail

          # The gate is job-wide, so it also covers checkout, setup-node and npm install. Three
          # categories, not two: the script separates "cannot serve" (1) from "could not determine" (2),
          # and collapsing them would make this issue assert something the run never established.
          case "${EXIT_CODE:-}" in
            1) cat=failing
               title="Committee health check is failing"
               summary="The liveness check ran and reported the committee UNABLE TO SERVE (exit 1)."
               detail="The run log has one line of JSON with a \`failingConjuncts\` list naming which part of \`requiredQuorum()\` is unsatisfied." ;;
            2) cat=undetermined
               title="Committee health check could not determine the state"
               summary="The liveness check ran but could not read the state (exit 2) -- RPC, config, or an unexpected contract shape."
               detail="This is NOT a verdict on the committee: it means the check could not see. It is still not healthy -- a monitor that cannot see is the failure mode this workflow exists to end." ;;
            *) cat=infrastructure
               title="Committee health check could not run"
               summary="The workflow failed BEFORE the liveness check produced a verdict (job result: ${RESULT}, liveness step: ${LIVENESS:-did not run})."
               detail="This says nothing about the committee. Likely causes, MOST PERSISTENT FIRST: COMMITTEE_VALIDATOR is unset or empty, so the guard step failed and the liveness check never ran (that one repeats every tick until someone sets the repository variable); the job hit its 5-minute timeout (a hung RPC or install); checkout/setup failed; or the pinned ethers install could not be fetched." ;;
          esac
          catlabel="committee-health-${cat}"
          # Shared with deploy/local-heartbeat.sh. Two monitors watch this stack now -- this workflow
          # and the local launchd heartbeat -- and they MUST find each other's issue or each opens its
          # own for the same fault. The marker, not the author, is what makes an issue monitor-owned.
          marker="<!-- committee-health-alert-v1:${catlabel} -->"

          # Dedup is keyed on the CATEGORY, not just on `committee-health`. With a single key, one open
          # issue would permanently suppress the real "is failing" alert this chain exists to deliver.
          # The standing example is an unset COMMITTEE_VALIDATOR: the guard step fails every tick
          # forever. Note it lands in `infrastructure`, NOT `undetermined` -- the guard's exit 2 is the
          # STEP's code, and only the liveness step writes $GITHUB_OUTPUT, so EXIT_CODE stays empty and
          # the case falls to `*)`.
          #
          # ACCEPTED, not solved: keying by category splits the masking three ways, it does not remove
          # it, and `infrastructure` is the mixed bucket. Nothing here closes an issue when the
          # condition clears either -- a category stays quiet until a person closes it, which is what
          # "Close it when resolved" in the body is asking for.
          #
          # THE AUTHOR FILTER IS GONE, replaced by the marker. It took `github-actions[bot]`, not the
          # `app/github-actions` that `--json author` PRINTS -- verified here, 0 matches vs 8 -- and
          # that was correct as far as it went. What it could not do is see the LOCAL heartbeat's
          # issues, which are authored by a person: with two monitors on one stack, filtering by
          # author means each is blind to the other and both file for the same fault. The filter's
          # real job was to stop a human-labelled issue from silently suppressing every future alert,
          # and the marker does that strictly better: it is owned by the monitors, not by an identity.
          existing=$(gh issue list --state open --label committee-health --label "$catlabel" \
                       --json number -q '.[].number' 2>/dev/null || true)
          for n in $existing; do
            if gh issue view "$n" --json body -q .body 2>/dev/null | grep -qF "$marker"; then
              existing="$n"; break
            fi
            existing=""
          done
          # Fall back to the TITLE when the label query finds nothing. If `--add-label` ever failed,
          # the dedup key is exactly the metadata that did not get attached, and the cause (a swallowed
          # `gh label create`) is persistent -- so without this the next tick opens another assigned
          # issue, and the next, every 15 minutes, with nothing to self-heal. Titles are fixed strings
          # chosen per category above, so this is an exact match, not a heuristic.
          if [ -z "$existing" ]; then
            existing=$(gh issue list --state open --json number,title \
                         -q "[.[]|select(.title==\"${title}\")]|.[0].number" 2>/dev/null || true)
            [ -n "$existing" ] && echo "::warning::found issue #${existing} by title, not by label -- its labels are missing, so dedup is degraded"
          fi
          if [ -n "$existing" ]; then
            echo "issue #${existing} is already open for category '${cat}' -- not commenting. Per-run history is in the Actions tab."
            exit 0
          fi

          gh label create committee-health --description "Automated committee liveness alerts" --color B60205 2>/dev/null || true
          gh label create "$catlabel" --description "Committee liveness alert category: ${cat}" --color D93F0B 2>/dev/null || true

          # Create FIRST, assign SECOND. `gh issue create --assignee` resolves the login before it
          # creates anything, so an unresolvable handle -- a typo in the very variable the header invites
          # people to change -- would fail the whole command under `set -e` and produce NO issue at all,
          # with no way for this job to alert about its own failure. A missing assignee costs a
          # notification; a failed create costs the entire alert.
          # Labels are attached AFTER creation, for the same reason as the assignee: `gh issue create
          # --label` resolves every label name BEFORE it creates anything, so if the label-create above
          # was swallowed by `|| true` (a transient failure, a permissions surprise) the create itself
          # fails and NO issue appears. The previous version applied that lesson to only one of the two
          # kinds of pre-resolved metadata.
          url=$(gh issue create \
            --title "$title" \
            --body "$(printf '%s\n' \
              "$marker" \
              "" \
              "$summary" \
              "" \
              "Stack router: ${WATCHED:-unknown} (the validator is whatever algId 0x01 resolves to)" \
              "Run: ${RUN_URL}" \
              "" \
              "$detail" \
              "" \
              "This issue is created once per category and stays quiet while open, so an ongoing outage does not post every 15 minutes." \
              "" \
              "The LOCAL heartbeat (deploy/local-heartbeat.sh) closes marker-bearing issues automatically when the stack recovers; this workflow does not close anything itself. If the local heartbeat is not running on the monitor host, close this by hand when resolved.")")
          echo "opened ${url}"
          num="${url##*/}"
          gh issue edit "$num" --add-label committee-health --add-label "$catlabel" \
            || echo "::warning::issue ${num} created but labels could not be attached -- dedup will not find it and the next tick will open another"
          gh issue edit "$num" --add-assignee "$ASSIGNEE" \
            || echo "::warning::issue ${num} created but assignee '${ASSIGNEE}' could not be set"
          # Read the assignee back. GitHub's assignee API SILENTLY IGNORES a valid username that lacks
          # push access -- `gh issue edit` exits 0, no warning is printed, and the issue notifies
          # nobody. That is precisely the "visible is not notified" failure the header exists to close,
          # entering through the very variable the header invites people to change. A guard that only
          # catches a non-zero exit does not catch it; asking who is actually assigned does.
          if [ "$(gh issue view "$num" --json assignees -q '.assignees|length' 2>/dev/null || echo 0)" = "0" ]; then
            echo "::warning::issue ${num} has NO assignee (does '${ASSIGNEE}' have push access?) -- it is visible but will notify nobody"
          fi
